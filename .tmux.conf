unbind r
bind r source-file ~/.tmux.conf

set -g mouse on
set -g prefix C-s

setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'dawn'
set -g @rose_pine_host 'on' # Enables hostname in the status bar
set -g @rose_pine_hostname_short 'on' # Makes the hostname shorter by using tmux's '#h' format
set -g @rose_pine_date_time ' | %H:%M %m-%d |' # It accepts the date UNIX command format (man date for info)
set -g @rose_pine_user 'off'
set -g @rose_pine_disable_active_window_menu 'on'

set -g @rose_pine_directory 'on' # Turn on the current folder component in the status bar

set -g @rose_pine_window_status_separator " | "
set -g @rose_pine_window_separator "-"
set -g @rose_pine_status_left_append_section '| '

set -g @rose_pine_left_separator ' > ' # The strings to use as separators are 1-space padded
set -g @rose_pine_right_separator ' '
set -g @rose_pine_field_separator ' '

set -g status-position top

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
